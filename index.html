<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Split">
<meta name="theme-color" content="#14532d">
<title>Bill Split</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
/* VOICE: quick, calm, one-handed at the table
   IDEA: the restaurant check folder, receipt slipped inside
   PICTURE: the receipt itself, one line per person, totals large
   COLOUR and TYPE: bottle green folder, paper white receipt, tomato accent; Figtree
   LAYOUT: single column, bill and tip, people with cash toggles, receipt below */
:root{color-scheme:light dark;
--bg:light-dark(#14532d,#0b2416);--paper:light-dark(#fffdf7,#18201b);--ink:light-dark(#141414,#eef2ee);
--mute:light-dark(#5f665f,#9aa69c);--line:light-dark(#d9d6cc,#2c3a30);--acc:#e8492f;--field:light-dark(#fff,#0f1712);--ok:light-dark(#14532d,#4ade80)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,sans-serif;overflow-x:clip;min-height:100vh}
main{max-width:460px;margin:0 auto;padding:20px 16px 40px}
h1{color:#fff;font-size:32px;line-height:1.05;font-weight:800;margin:6px 0 16px}
h2{font-size:17px;margin:0 0 10px;font-weight:800}
.card{background:var(--paper);border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.25);margin-bottom:14px}
label{display:block;font-size:14px;font-weight:600;color:var(--mute);margin-bottom:6px}
input{font-family:inherit;color:var(--ink);background:var(--field);border:2px solid var(--line);border-radius:12px}
input:focus{outline:none;border-color:var(--acc)}
.big{width:100%;font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;padding:10px 14px;min-height:56px}
.row{margin-bottom:16px}
.tips{display:flex;gap:8px;margin-top:8px}
.tips button,.add{flex:1;min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--field);color:var(--ink);font:600 16px Figtree,sans-serif}
.tips button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.person{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.person input{flex:1;font-size:16px;font-weight:600;padding:8px 10px;min-height:44px}
.cashbtn{min-height:44px;min-width:92px;border-radius:22px;border:2px solid var(--line);background:var(--field);color:var(--mute);font:600 15px Figtree,sans-serif;white-space:nowrap}
.cashbtn.on{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.del{min-height:44px;width:44px;border:0;background:none;color:var(--mute);font-size:24px;line-height:1}
.add{width:100%;margin-top:12px;flex:none}
.receipt{padding:20px 18px 26px;border-radius:4px 4px 0 0;
-webkit-mask:radial-gradient(circle 7px at 50% 100%,#0000 98%,#000) 0 0/16px 100% repeat-x;
mask:radial-gradient(circle 7px at 50% 100%,#0000 98%,#000) 0 0/16px 100% repeat-x}
.who{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.who span{font-weight:600;overflow-wrap:anywhere}
.who small{display:block;color:var(--acc);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.amt{font-weight:800;font-size:clamp(24px,7.5vw,32px);font-variant-numeric:tabular-nums;white-space:nowrap}
.meta{display:flex;justify-content:space-between;gap:12px;color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.warn{background:light-dark(#fff1ee,#3a1712);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}
.copy{margin-top:14px;width:100%;min-height:48px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:800 16px Figtree,sans-serif}
.note{color:#cfe3d3;font-size:13px;margin-top:4px}
</style>
</head>
<body>
<main>
<h1>Split the bill</h1>
<div class="card">
  <div class="row">
    <label for="bill">Bill total</label>
    <input class="big" id="bill" inputmode="decimal" placeholder="0" value="67,500" autocomplete="off">
  </div>
  <label for="tip">Tip %</label>
  <input class="big" id="tip" inputmode="decimal" value="10" autocomplete="off">
  <div class="tips" id="presets">
    <button type="button" data-v="10">10%</button>
    <button type="button" data-v="12">12%</button>
    <button type="button" data-v="15">15%</button>
    <button type="button" data-v="20">20%</button>
  </div>
</div>

<div class="card">
  <h2>Who's paying</h2>
  <div id="people"></div>
  <button class="add" id="add" type="button">+ Add person</button>
</div>

<div class="card receipt" aria-live="polite">
  <div class="meta" style="margin-bottom:4px"><span>Bill <b id="mBill">0</b></span><span>Tip <b id="mTip">0</b></span></div>
  <div id="out"></div>
  <div class="meta" style="margin-top:10px"><span>Each pays in total</span><b id="each">0</b></div>
  <div id="warn"></div>
  <button class="copy" id="copy" type="button">Copy totals</button>
</div>
<p class="note">Bill and tip split equally. People with cash pay the whole tip between them; everyone else pays their share of it on card.</p>
</main>
<script>
{
const $=id=>document.getElementById(id);
const bill=$('bill'),tip=$('tip');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const parse=s=>{s=String(s).replace(/\s/g,'');
  const m=s.match(/[.,](\d{1,2})$/);let dec='';
  if(m){dec='.'+m[1];s=s.slice(0,-m[0].length)}
  const n=parseFloat(s.replace(/[.,]/g,'')+dec);return isNaN(n)?0:n};
const fmt=n=>{const r=Math.round(n*100)/100;
  return r.toLocaleString('en-US',{minimumFractionDigits:r%1?2:0,maximumFractionDigits:2})};

let people=[{name:'Me',cash:false},{name:'Josh',cash:true}];
try{const s=JSON.parse(localStorage.getItem('splitPeople'));if(Array.isArray(s)&&s.length)people=s}catch(e){}
try{const s=localStorage.getItem('splitTip');if(s)tip.value=s}catch(e){}
const save=()=>{try{localStorage.setItem('splitPeople',JSON.stringify(people));localStorage.setItem('splitTip',tip.value)}catch(e){}};

function renderPeople(){
  $('people').innerHTML=people.map((p,i)=>`<div class="person">
    <input aria-label="Name" data-i="${i}" value="${esc(p.name)}">
    <button type="button" class="cashbtn${p.cash?' on':''}" data-cash="${i}" aria-pressed="${p.cash}">${p.cash?'Has cash':'No cash'}</button>
    ${people.length>2?`<button type="button" class="del" data-del="${i}" aria-label="Remove">×</button>`:''}
  </div>`).join('');
}
let last='';
function calc(){
  const b=parse(bill.value),pc=parse(tip.value),t=b*pc/100,n=people.length;
  const cashers=people.filter(p=>p.cash).length;
  const each=(b+t)/n,cashEach=cashers?t/cashers:0;
  $('mBill').textContent=fmt(b);$('mTip').textContent=fmt(t)+' ('+fmt(pc)+'%)';
  $('each').textContent=fmt(each);
  const rows=people.map(p=>{
    const card=cashers&&p.cash?each-cashEach:each;
    return {name:p.name||'Someone',card,cash:cashers&&p.cash?cashEach:0}});
  $('out').innerHTML=rows.map(r=>`<div class="who"><div><span>${esc(r.name)}</span>${r.cash?`<small>+ ${fmt(r.cash)} cash tip</small>`:''}</div><div class="amt">${fmt(r.card)}</div></div>`).join('');
  let w='';
  if(!cashers)w='Nobody has cash, so the tip is included in everyone’s card total. Check the restaurant will take the tip on card.';
  else if(rows.some(r=>r.card<0))w='The cash tip is bigger than a cash payer’s share of the bill, so their card total is negative: others owe them the difference.';
  $('warn').innerHTML=w?`<div class="warn">${w}</div>`:'';
  document.querySelectorAll('#presets button').forEach(x=>x.classList.toggle('on',parse(x.dataset.v)===pc));
  last=`Bill ${fmt(b)}, tip ${fmt(pc)}% (${fmt(t)})\n`+rows.map(r=>`${r.name}: ${fmt(r.card)} card${r.cash?` + ${fmt(r.cash)} cash tip`:''}`).join('\n');
  save();
}
$('people').addEventListener('input',e=>{const i=e.target.dataset.i;if(i!=null){people[i].name=e.target.value;calc()}});
$('people').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
  if(t.dataset.cash!=null){const p=people[t.dataset.cash];p.cash=!p.cash}
  else if(t.dataset.del!=null){people.splice(+t.dataset.del,1)}
  renderPeople();calc()});
$('add').addEventListener('click',()=>{people.push({name:'Friend '+people.length,cash:false});renderPeople();calc()});
bill.addEventListener('input',calc);tip.addEventListener('input',calc);
bill.addEventListener('blur',()=>{if(bill.value)bill.value=fmt(parse(bill.value))});
bill.addEventListener('focus',()=>bill.select());tip.addEventListener('focus',()=>tip.select());
$('presets').addEventListener('click',e=>{const v=e.target.dataset&&e.target.dataset.v;if(v){tip.value=v;calc()}});
$('copy').addEventListener('click',async()=>{const btn=$('copy');
  try{await navigator.clipboard.writeText(last);btn.textContent='Copied'}catch(e){btn.textContent='Copy not allowed here'}
  setTimeout(()=>btn.textContent='Copy totals',1500)});
renderPeople();calc();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
}
</script>
</body>
</html>
